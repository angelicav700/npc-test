<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地球Online · NPC身份诊断</title>
<style>
  :root{
    --bg:#06090f;
    --panel:#0c1320;
    --panel2:#0e1728;
    --line:#1c2a3d;
    --cyan:#22d3ee;
    --gold:#fbbf24;
    --purple:#a78bfa;
    --red:#f87171;
    --green:#4ade80;
    --orange:#fb923c;
    --text:#dce8f5;
    --dim:#6b7f99;
    --mono:"Cascadia Code","JetBrains Mono",Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-tap-highlight-color:transparent;}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh;overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(ellipse 60% 40% at 50% -10%, rgba(34,211,238,.10), transparent 60%),
      radial-gradient(ellipse 40% 30% at 90% 110%, rgba(167,139,250,.08), transparent 60%),
      radial-gradient(ellipse 40% 30% at 5% 100%, rgba(251,191,36,.05), transparent 60%);
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.35;
    background:repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.12) 3px 4px);
  }
  .wrap{position:relative;z-index:2;max-width:720px;margin:0 auto;padding:24px 16px 64px;}

  .hidden{display:none !important;}
  .sysmsg{
    font-family:var(--mono);font-size:12px;color:var(--cyan);
    border-left:2px solid var(--cyan);background:rgba(34,211,238,.06);
    padding:8px 12px;letter-spacing:.5px;margin-bottom:18px;line-height:1.8;
  }
  .btn{
    display:inline-block;cursor:pointer;user-select:none;
    font-family:var(--mono);font-size:15px;letter-spacing:2px;
    color:var(--cyan);background:rgba(34,211,238,.08);
    border:1px solid rgba(34,211,238,.55);
    padding:14px 38px;position:relative;
    transition:all .18s ease;
    clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
  }
  .btn:hover{background:rgba(34,211,238,.18);box-shadow:0 0 22px rgba(34,211,238,.35);color:#fff;}
  .btn.gold{color:var(--gold);border-color:rgba(251,191,36,.55);background:rgba(251,191,36,.08);}
  .btn.gold:hover{background:rgba(251,191,36,.18);box-shadow:0 0 22px rgba(251,191,36,.3);}
  .btn.small{padding:9px 20px;font-size:13px;}

  /* ---------- 开始页 ---------- */
  #screen-start{text-align:center;padding-top:8vh;animation:fadein .6s ease;}
  .logo-mini{font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:6px;margin-bottom:26px;}
  .big-title{
    font-size:clamp(44px,10vw,76px);font-weight:900;letter-spacing:4px;line-height:1.1;
    color:#fff;text-shadow:0 0 30px rgba(34,211,238,.55),0 0 80px rgba(34,211,238,.25);
  }
  .big-title .on{color:var(--cyan);}
  .sub-title{margin-top:16px;font-family:var(--mono);font-size:clamp(14px,3.5vw,18px);color:var(--gold);letter-spacing:8px;}
  .glitch-tag{margin-top:30px;font-family:var(--mono);font-size:12px;color:var(--dim);line-height:2;}
  .glitch-tag b{color:var(--cyan);font-weight:400;}
  .stat-chips{display:flex;justify-content:center;gap:10px;margin:34px 0;flex-wrap:wrap;}
  .chip{font-family:var(--mono);font-size:12px;color:var(--text);border:1px solid var(--line);background:var(--panel);padding:8px 16px;letter-spacing:1px;}
  .chip b{color:var(--gold);font-weight:700;}
  .start-hint{font-size:13px;color:var(--dim);margin-top:18px;line-height:1.9;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
  .cursor{animation:blink 1s step-end infinite;color:var(--cyan);}

  /* ---------- 答题页 ---------- */
  #screen-quiz{animation:fadein .4s ease;}
  .quiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:1px;}
  .quiz-top .qn{color:var(--cyan);}
  .hpbar{height:8px;background:#0a101c;border:1px solid var(--line);position:relative;margin-bottom:28px;}
  .hpbar .fill{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--purple));box-shadow:0 0 12px rgba(34,211,238,.7);transition:width .35s ease;}
  .qcard{animation:slidein .35s ease;}
  .qtag{font-family:var(--mono);font-size:12px;color:var(--gold);letter-spacing:3px;margin-bottom:14px;}
  .qtext{font-size:clamp(18px,4.6vw,22px);font-weight:700;line-height:1.7;color:#fff;margin-bottom:8px;}
  .qsub{font-size:12.5px;color:var(--dim);margin-bottom:24px;line-height:1.8;font-style:italic;}
  .opts{display:flex;flex-direction:column;gap:12px;}
  .opt{
    display:flex;align-items:flex-start;gap:14px;cursor:pointer;user-select:none;width:100%;
    background:var(--panel);border:1px solid var(--line);
    padding:15px 16px;text-align:left;font-size:15px;line-height:1.65;color:var(--text);
    transition:all .15s ease;font-family:inherit;
  }
  .opt:hover{border-color:rgba(34,211,238,.6);background:var(--panel2);transform:translateX(4px);}
  .opt .key{flex:none;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;color:var(--dim);border:1px solid var(--line);margin-top:1px;transition:all .15s ease;}
  .opt:hover .key{color:var(--cyan);border-color:var(--cyan);}
  .opt.selected{border-color:var(--cyan);background:rgba(34,211,238,.1);box-shadow:0 0 18px rgba(34,211,238,.25);}
  .opt.selected .key{background:var(--cyan);color:#031018;border-color:var(--cyan);}
  .quiz-foot{margin-top:26px;display:flex;justify-content:space-between;align-items:center;}
  .btn-back{font-family:var(--mono);font-size:12px;color:var(--dim);background:none;border:none;cursor:pointer;letter-spacing:1px;padding:8px 0;}
  .btn-back:hover{color:var(--cyan);}
  .btn-back:disabled{opacity:.25;cursor:default;}
  .kbd-hint{font-family:var(--mono);font-size:11px;color:#3a4a61;}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @keyframes slidein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* ---------- 分析页 ---------- */
  #screen-loading{padding-top:16vh;animation:fadein .4s ease;}
  .terminal{max-width:480px;margin:0 auto;font-family:var(--mono);font-size:13px;line-height:2.2;background:rgba(6,10,18,.9);border:1px solid var(--line);padding:24px 22px;color:var(--green);}
  .terminal .tline{opacity:0;transform:translateY(4px);transition:all .3s ease;}
  .terminal .tline.show{opacity:1;transform:none;}
  .terminal .caret{display:inline-block;width:8px;height:14px;background:var(--green);vertical-align:-2px;animation:blink .8s step-end infinite;}

  /* ---------- 结果页 · 攻略结构 ---------- */
  #screen-result{animation:fadein .5s ease;}
  .panel{
    background:var(--panel);border:1px solid var(--line);
    padding:26px 22px;margin-bottom:0;position:relative;
    clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
  }
  .sec{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .sec .pixicon{flex:none;line-height:0;}
  .sec .no{font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:2px;line-height:1.6;}
  .sec h2{font-size:19px;font-weight:800;color:#fff;letter-spacing:1px;}
  .sec .sub{font-family:var(--mono);font-size:11px;color:var(--dim);margin-left:auto;}

  /* 板块间过渡桥 */
  .bridge{text-align:center;padding:18px 12px;font-family:var(--mono);font-size:12px;color:var(--dim);line-height:1.9;animation:fadein .6s ease;}
  .bridge .arr{display:block;color:var(--cyan);font-size:15px;margin-bottom:4px;letter-spacing:4px;animation:blink 1.6s step-end infinite;}
  .bridge em{font-style:normal;color:var(--cyan);}

  /* 系统邮件开场 */
  .mail{border-color:rgba(34,211,238,.35);}
  .mail-head{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:1px;border-bottom:1px dashed var(--line);padding-bottom:12px;margin-bottom:14px;line-height:1.8;flex-wrap:wrap;gap:6px;}
  .mail-body{font-size:14.5px;line-height:2.1;color:#c6d5e6;}
  .mail-body b{color:var(--cyan);font-weight:700;}

  /* 像素图 */
  .pixel svg{image-rendering:pixelated;display:block;}
  .avatar-stage{text-align:center;padding:6px 0 20px;}
  .avatar-stage .pixel{display:inline-block;filter:drop-shadow(0 4px 14px rgba(0,0,0,.6));}
  .avatar-name-tag{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:2px;margin-top:12px;}

  .diag-card{text-align:center;border-color:rgba(251,191,36,.4);background:linear-gradient(180deg,rgba(251,191,36,.05),var(--panel));}
  .diag-tag{font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:4px;margin-bottom:14px;}
  .arch-name{font-size:clamp(30px,7vw,42px);font-weight:900;color:var(--gold);letter-spacing:3px;text-shadow:0 0 30px rgba(251,191,36,.4);margin-bottom:14px;}
  .arch-desc{font-size:15px;line-height:1.9;color:var(--text);max-width:480px;margin:0 auto 18px;}
  .arch-line{font-family:var(--mono);font-size:13px;color:var(--cyan);letter-spacing:1px;border:1px dashed rgba(34,211,238,.4);padding:10px 18px;display:inline-block;margin-bottom:22px;}
  .level-badge{display:inline-block;font-family:var(--mono);font-size:13px;letter-spacing:3px;padding:10px 26px;border:1px solid;}
  .level-0{color:var(--red);border-color:var(--red);background:rgba(248,113,113,.08);}
  .level-1{color:var(--orange);border-color:var(--orange);background:rgba(251,146,60,.08);}
  .level-2{color:var(--cyan);border-color:var(--cyan);background:rgba(34,211,238,.08);}
  .level-3{color:var(--green);border-color:var(--green);background:rgba(74,222,128,.08);}
  .awaken-line{font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:14px;letter-spacing:1px;}
  .mixed-note{margin-top:18px;font-size:13px;color:var(--purple);line-height:1.8;border-left:2px solid var(--purple);padding-left:12px;text-align:left;}
  .hope-box{margin-top:22px;text-align:left;border:1px solid rgba(74,222,128,.3);background:rgba(74,222,128,.05);padding:16px 18px;}
  .hope-box .hb-t{font-family:var(--mono);font-size:12px;color:var(--green);letter-spacing:2px;margin-bottom:10px;}
  .hope-box p{font-size:14px;line-height:2;color:#c3d6c8;}
  .hope-box p b{color:var(--green);}

  .radar-box{display:flex;justify-content:center;}
  .radar-box svg{width:100%;max-width:420px;height:auto;}
  .dim-bars{margin-top:24px;display:flex;flex-direction:column;gap:14px;}
  .drow .drow-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;}
  .drow .dname{font-weight:700;letter-spacing:1px;}
  .drow .dval{font-family:var(--mono);}
  .dbar{height:6px;background:#0a101c;border:1px solid var(--line);}
  .dbar .fill{height:100%;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1);}
  .drow .dtrait{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.7;}

  .deep-text{font-size:14.5px;line-height:2.05;color:#b8c8da;}
  .deep-text b{color:var(--gold);font-weight:700;}

  /* 症状实录：可交互 */
  ul.gamelist{list-style:none;display:flex;flex-direction:column;gap:12px;}
  ul.gamelist li{
    position:relative;padding:12px 14px 12px 44px;font-size:14.5px;line-height:1.85;
    background:var(--panel2);border:1px solid var(--line);cursor:pointer;transition:all .15s ease;
  }
  ul.gamelist li:hover{border-color:rgba(248,113,113,.5);}
  ul.gamelist li::before{content:"□";position:absolute;left:14px;top:12px;font-family:var(--mono);font-size:14px;color:var(--dim);}
  ul.gamelist li.hit{border-color:var(--red);background:rgba(248,113,113,.08);}
  ul.gamelist li.hit::before{content:"✕";color:var(--red);font-weight:700;}
  .hit-counter{font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:16px;letter-spacing:1px;text-align:right;}
  .hit-counter b{color:var(--red);font-size:15px;}

  /* 新手任务链 */
  .action-list{display:flex;flex-direction:column;gap:14px;}
  .action{
    display:flex;gap:14px;align-items:flex-start;
    background:var(--panel2);border:1px solid rgba(74,222,128,.25);padding:16px;cursor:pointer;transition:all .15s ease;
  }
  .action:hover{border-color:rgba(74,222,128,.6);}
  .action .an{flex:none;font-family:var(--mono);font-size:11px;color:var(--green);border:1px solid rgba(74,222,128,.5);padding:4px 8px;margin-top:2px;letter-spacing:1px;}
  .action .at{font-size:14.5px;line-height:1.85;}
  .action.done{opacity:.55;}
  .action.done .at{text-decoration:line-through;text-decoration-color:rgba(74,222,128,.7);}

  .roadmap{display:flex;flex-direction:column;}
  .rm-stage{position:relative;padding:0 0 26px 30px;border-left:1px solid var(--line);margin-left:8px;}
  .rm-stage:last-child{padding-bottom:0;}
  .rm-stage::before{content:"";position:absolute;left:-6px;top:4px;width:11px;height:11px;background:var(--bg);border:2px solid var(--cyan);transform:rotate(45deg);}
  .rm-stage.gold::before{border-color:var(--gold);}
  .rm-stage.purple::before{border-color:var(--purple);}
  .rm-stage .rm-t{font-family:var(--mono);font-size:12px;color:var(--cyan);letter-spacing:2px;margin-bottom:8px;}
  .rm-stage.gold .rm-t{color:var(--gold);}
  .rm-stage.purple .rm-t{color:var(--purple);}
  .rm-stage .rm-d{font-size:14.5px;line-height:1.9;}

  /* BOSS 战 */
  .boss-box{border:1px solid rgba(248,113,113,.35);background:rgba(248,113,113,.05);padding:20px;}
  .boss-head{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap;}
  .boss-head .bn{font-size:17px;font-weight:800;color:var(--red);letter-spacing:1px;}
  .boss-head .btag{font-family:var(--mono);font-size:10px;color:var(--red);border:1px solid rgba(248,113,113,.4);padding:3px 8px;letter-spacing:2px;}
  .boss-box p{font-size:14.5px;line-height:2;color:#c4b8c4;}
  .boss-box p b{color:var(--red);}
  .boss-box .weakness{margin-top:14px;font-family:var(--mono);font-size:12px;color:var(--gold);border-top:1px dashed rgba(248,113,113,.3);padding-top:12px;line-height:1.9;}

  .team-box{border:1px solid rgba(167,139,250,.35);background:rgba(167,139,250,.05);padding:20px;display:flex;gap:18px;align-items:flex-start;}
  .team-box .tm-name{font-size:16px;font-weight:800;color:var(--purple);margin-bottom:12px;letter-spacing:1px;}
  .team-box p{font-size:14.5px;line-height:2;color:#c3cad9;}
  .team-box p b{color:var(--purple);}

  .next-box{text-align:center;border-color:rgba(251,191,36,.4);}
  .next-box p{font-size:14.5px;line-height:2;color:#c9d6e5;margin-bottom:18px;}
  .next-box p b{color:var(--gold);}

  /* 终章 · 觉醒宣言 */
  .final-card{text-align:center;border-color:rgba(34,211,238,.45);background:linear-gradient(180deg,rgba(34,211,238,.06),var(--panel));position:relative;overflow:hidden;}
  .final-tag{font-family:var(--mono);font-size:12px;color:var(--cyan);letter-spacing:6px;margin-bottom:18px;}
  .final-title{font-size:clamp(26px,6vw,34px);font-weight:900;color:#fff;letter-spacing:6px;margin-bottom:20px;text-shadow:0 0 26px rgba(34,211,238,.5);}
  .final-text{font-size:14.5px;line-height:2.2;color:#c6d5e6;max-width:520px;margin:0 auto 22px;}
  .final-text b{color:var(--cyan);}
  .declare{
    font-size:15.5px;line-height:2.3;color:#e8f2fb;max-width:520px;margin:0 auto 26px;
    border:1px dashed rgba(34,211,238,.4);padding:22px 20px;position:relative;background:rgba(34,211,238,.04);
  }
  .declare .sig{display:block;margin-top:14px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--cyan);letter-spacing:1px;}
  .stamp-zone{position:relative;display:inline-block;min-height:96px;}
  .seal{
    position:absolute;right:-70px;top:-6px;width:86px;height:86px;border-radius:50%;
    border:3px solid #e05252;color:#e05252;
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    font-family:var(--mono);font-weight:900;font-size:22px;letter-spacing:3px;
    transform:rotate(-14deg) scale(3);opacity:0;
  }
  .seal small{font-size:9px;letter-spacing:2px;font-weight:400;margin-top:2px;}
  .seal.stamped{animation:stampIn .35s cubic-bezier(.2,2,.4,1) forwards;}
  @keyframes stampIn{
    0%{transform:rotate(-14deg) scale(3);opacity:0;}
    100%{transform:rotate(-14deg) scale(1);opacity:.92;}
  }
  .final-stats{display:flex;justify-content:center;gap:26px;margin:24px 0 8px;flex-wrap:wrap;}
  .fstat{font-family:var(--mono);font-size:11px;color:var(--dim);line-height:2;letter-spacing:1px;}
  .fstat b{display:block;font-size:20px;color:var(--cyan);font-weight:700;}

  .result-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:30px;}

  #toast{
    position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(80px);
    background:var(--panel2);border:1px solid var(--cyan);color:var(--cyan);
    font-family:var(--mono);font-size:13px;padding:12px 24px;z-index:99;
    transition:transform .3s ease;box-shadow:0 0 24px rgba(34,211,238,.3);letter-spacing:1px;max-width:86vw;text-align:center;
  }
  #toast.show{transform:translateX(-50%) translateY(0);}

  footer{margin-top:40px;text-align:center;font-family:var(--mono);font-size:11px;color:#33425a;letter-spacing:1px;line-height:2;}

  @media(max-width:480px){
    .panel{padding:22px 16px;}
    .sec .sub{display:none;}
    .seal{right:-46px;width:70px;height:70px;font-size:17px;}
    .team-box{flex-direction:column;}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ 开始页 ============ -->
  <section id="screen-start">
    <div class="logo-mini">EARTH ONLINE · SYSTEM BOOT</div>
    <h1 class="big-title">地球<span class="on">Online</span></h1>
    <div class="sub-title">NPC 身份诊断</div>
    <div class="glitch-tag">
      &gt; 你是在玩地球Online，还是被地球Online玩？<br>
      &gt; <b>36</b> 道题，测出你被什么困在了NPC身份里<span class="cursor">_</span>
    </div>
    <div class="stat-chips">
      <span class="chip"><b>36</b> 道场景题</span>
      <span class="chip"><b>5</b> 维属性面板</span>
      <span class="chip"><b>8</b> 种NPC原型</span>
    </div>
    <button class="btn" id="btn-start">▶ 进入诊断</button>
    <p class="start-hint">约需 5 分钟 · 请凭第一直觉作答，不要思考「正确答案」<br>本测试没有对错，只有你和自己的距离</p>
  </section>

  <!-- ============ 答题页 ============ -->
  <section id="screen-quiz" class="hidden">
    <div class="quiz-top">
      <span>地球Online · 角色检测中</span>
      <span class="qn" id="qnum">Q 01 / 36</span>
    </div>
    <div class="hpbar"><div class="fill" id="hpfill"></div></div>
    <div class="qcard" id="qcard"></div>
    <div class="quiz-foot">
      <button class="btn-back" id="btn-back">&lt; 返回上一题</button>
      <span class="kbd-hint">键盘 1-4 可快速作答</span>
    </div>
  </section>

  <!-- ============ 分析页 ============ -->
  <section id="screen-loading" class="hidden">
    <div class="terminal" id="terminal"></div>
  </section>

  <!-- ============ 结果页 ============ -->
  <section id="screen-result" class="hidden"></section>

  <footer>
    EARTH ONLINE v2.0 · NPC DIAGNOSTIC SYSTEM<br>
    本测试为娱乐与自我觉察工具，不构成任何人生指令
  </footer>
</div>

<div id="toast">已复制，去粘贴发帖吧</div>

<script>
/* ================================================================

const ARCHETYPES = {
  A:{name:"主线任务搬运工",tag:"核心卡关维度：任务自主性",
    desc:"按部就班走了三十年，从没打开过任务日志看看自己到底要什么。",

    deep:"你运行的是一份<b>继承来的剧本</b>：父母的期待、同龄人的节奏、社会的默认模板——心理学称之为「脚本化人生」。更深层的问题是<b>外部目标取向</b>：研究反复表明，追逐他人设定的目标，即使达成了，幸福感也不会提升，反而伴随「这真的是我要的吗」的空虚。你不是没有能力选择，而是<b>从未被允许练习选择</b>。练得少了，「我想要什么」这个功能就休眠了。请放心：它没有坏，只是在等你重新登录。",
    list:["别人问「你最近在忙什么」，你的回答总以「没办法，工作／家里要求」开头","你的待办清单里全是「必须做」，几乎没有「我想做」","人生重大决定（志愿、工作、城市）至少有一半是别人拍的板","你说「我不行」的次数，远远多于「我不想」","周末空下来，你的第一反应是补觉补剧，而不是「终于可以做我的事了」"],
    actions:["今晚花 10 分钟建一份「我的任务日志」：写下 3 件「没有任何外部奖励、但我就是想做」的事，先不评判可行性","本周做一次主线审计：把正在做的事分成两栏——「我选的」和「别人发给我的」，看清比例","挑一件你纯粹因为「大家都是」而做的事，这周暂停一次，观察一下感受"],
    roadmap:{week:"完成主线审计，标记出 3 个「从没问过自己」的领域（工作／城市／关系），把问题写下来贴在看得见的地方",month:"在其中一个领域发起一次支线实验：接一个副项目、学一个无关技能、去一座陌生城市。规模不重要，重要的是「这次是我选的」",year:"完成一次主动的人生结构调整——转岗、搬家或关系重谈。这次的标准只有一个：在决策记录里，签字的是你自己"},
    boss:"「同辈进度条」——每当你看到同龄人升职、买房、结婚，你会瞬间觉得自己手里的支线「不务正业」，乖乖掉回主线。记住：你在看别人的进度条，别人也在看你的。",

  B:{name:"装备收集型NPC",tag:"核心卡关维度：身份解绑度",
    desc:"装备=身份。没有名牌包、好车、编制傍身，你就不确定「我是谁」。",
    line:"「你现在什么职位？」",
    hope:"你对品质、价值和「什么是好东西」的判断力远超平均——这是天生的产品人和买手底子。把它从「证明自己」的服务器，迁到「创造价值」的服务器，就是转职。",
    deep:"你的自我价值感挂在<b>外部认证</b>上——心理学称之为「外源自尊」。每一件装备都在替你回答「我是谁」这个问题，所以装备不能停：包要新款、车要升级、职位要够响。消费心理学者称之为<b>补偿性消费</b>——你买的时候缓解的是不安，不是需求。危险的根源在于「延伸自我」效应：<b>当「我拥有什么」变成「我是什么」，装备一贬值，你就跟着掉血</b>。而装备，永远在贬值。",
    list:["发朋友圈前，会先想想「这会不会显得我混得不错／不好」","认识新朋友，10 分钟内就会想知道对方的职位和收入量级","心情低落时，购物车比日记本先打开","两份工作钱差不多，你会选「说出去有面子」的那个","扔掉一件贵的东西，你感觉掉了等级，而不只是掉了一件物品"],
    actions:["本周做一次「装备断舍离」：挑一件很久不用但「不敢扔因为贵」的东西，送人或卖掉，记录感受","写一段「裸机自我介绍」：不用任何头衔、公司、资产，只描述你做的事和你在乎的事","下次想买超过 500 元的东西前，先写一句话：我在买的到底是功能，还是「那个更好的自己」？"],
    roadmap:{week:"完成裸机自我介绍并存档——这是你第一份不依赖装备的身份证明",month:"把每月装备预算的 30% 转投到技能和体验上（课程、旅行、作品），亲身对比「花钱买经历」和「花钱买面子」的差别",year:"建立至少一个「不消费也能确认自我价值」的身份锚点——一个作品、一项被认可的技能、一个社群角色。装备会贬值，锚点只会升值"},
    boss:"「版本更新」——新款永远在出，同辈永远在买。当你的价值感绑定在装备栏，别人每换一次装，你就自动掉一次血。唯一的解法，是把绑定对象从装备换成你自己。",
    weakness:"它怕你停止对比的那一刻——当你不再看别人的装备栏，它就从世界BOSS降级成了路边小怪。",
    team:"技能点错者",teamWhy:"你向外收集装备，TA向内寻找天赋。TA会问你那个扎心的问题——<b>「剥掉这些，你还剩什么？」</b>你们互为镜子，照见对方不敢看的那一面。"},
  C:{name:"新手村钉子户",tag:"核心卡关维度：安全区突破力",
    desc:"用「稳定」给自己上麻药。想走出安全区，腿先软了。",
    line:"「再等等吧。」",
    hope:"你的谨慎和风险意识是真实的天赋——大多数莽撞的玩家都死在没有你这样的人把关上。你只需要把这份谨慎从「拒绝出发」重新配置成「计算路线」。",
    deep:"这不是懒，是<b>损失厌恶</b>——心理学研究反复证明：人对「失去现有」的痛感，约是「得到新的」快感的两倍。你的大脑每天给你做同一道算术题：已知的无聊 vs 未知的危险，答案永远是留在村里。再加上<b>沉没成本</b>的加成——都熬了这么多年了，现在走多亏——于是一个村子住成了祖宅。而长期待在舒适区还有个隐藏代价：你的<b>自我效能感</b>（「我能搞定新事情」的信念）会因为缺乏证据而逐年折旧。可怕的不是你出不去，而是你已经把「出去」这件事，从待办清单挪到了「下辈子再说」。",
    list:["「再等等」是你的口头禅，但你等的是什么，其实说不清","过去 3 年，你人生的关键词没换过：同一份工作、同一座城市、同一套生活动线","收藏夹里躺着很多「以后去／以后学／以后试」，没有一个有日期","别人冒险成功的消息让你隐隐不甘，你安慰自己「那是他运气好」","你常用「我这个人就是这样」来终结所有关于改变的话题"],
    actions:["今天定一个 5% 的冒险：不用换城市那么大，就做一件平时绝不会做的小事——换条路线上班、约一个陌生领域的人聊聊、报一节没上过的体验课","从收藏夹里挑出放得最久的那条「以后」，给TA定一个本月内的日期","开一个「离村基金」：每月固定存一笔，金额不重要，重要的是给大脑一个信号——地图随时可以换"],
    roadmap:{week:"完成 3 次 5% 冒险，每次记一句「其实也没那么可怕」",month:"进一次真正的新副本——一个小项目、一段新关系、一个新圈子，允许自己表现笨拙，新手掉血很正常",year:"完成一次结构性换图：换岗位、换城市、换行业三选一。带着你攒了一年的离村基金，以及「换过一次地图」的经验值"},
    boss:"「亲友团的安全感绑架」——「多稳定啊，别折腾了。」每次你想走，最亲的人会把你劝回村。记住：他们不是坏，他们只是也怕。你的解法不是说服他们，是先走给他们看。",
    weakness:"它怕的不是你的勇气，是别人的成功案例——你每见一个「走出来还活得更好」的人，它的护盾就裂一道缝。",
    team:"主线任务搬运工",teamWhy:"TA执行力满级但没方向，你有想法但不敢动。<b>你们组队</b>：TA负责迈腿，你负责看地图——一个冲锋一个导航，离开新手村的效率翻倍。"},
  D:{name:"空血条幸存者",tag:"核心卡关维度：血条管理力",
    desc:"讨好型+内耗型。血条常年飘红，周末累到不想说话，但你说「我没事」。",
    line:"「我没事，我还好。」",
    hope:"你的共情力、责任心和「让别人舒服」的能力是稀有属性——只是长期供血给别人了。同一套系统，供血给自己时，你会是最快学会回血的那批玩家。",
    deep:"你运行的是一套<b>高警觉、低回报</b>的生存程序：把别人的情绪当任务，把冲突当最大伤害——心理学里叫「取悦症」叠加「情绪耗竭」。你不是天生脾气好，你是学会了：<b>只有让别人满意，环境才安全</b>。这套程序往往有个更早的来源——很久以前，你的安全感确实需要靠察言观色来挣。问题是它太费蓝：你替所有人回血，却找不到自己的补给点。再叠加<b>反刍思维</b>——白天没说的话，深夜在脑内重播一百遍——血条就永远在飘红。你说「我没事」的次数越多，系统就越相信你不需要回血，于是发给你的任务只会更多。",
    list:["微信里「收到」「好的」「没关系」的发送频率，高到能当口头禅","聚会上你经常是照顾气氛、递话圆场的那一个","你很难想起「我上一次发脾气」是什么时候","「算了」是你心里出现频率最高的词之一","周末的累不是玩累了，是「撑了一周，终于能躺了」"],
    actions:["今天拒绝一次：找一件「不想去但不好意思推」的事，用「这次不行」三个字推掉，不加任何长篇解释","建一个「回血清单」：写下 5 件做完真的会恢复能量的小事（刷手机不算），本周至少执行 2 件","给「我没事」做个翻译练习：下次想说之前，先在心里问一句——我实际上是累、烦、还是委屈？不用说出来，识别到就算完成"],
    roadmap:{week:"完成 3 次小型拒绝 + 2 次回血清单执行，记录每次的心理变化",month:"建立稳定的「下线时间」：每周固定时段，消息不回、安排不接，像服务器维护一样理直气壮",year:"你的社交圈会完成一轮自然更新——留下那些不因为你拒绝就消失的人。你会惊讶于最后剩下来的质量"},
    boss:"「愧疚感反扑」——每次你拒绝别人、优先自己，愧疚感会立刻到账：「我是不是太自私了？」提前告诉你：那不是良心，那是旧程序的补丁。重启几次，它就卸载了。",
    weakness:"它怕的是重复暴露——你每拒绝一次而不道歉，它的攻击力就永久 -10。它赢不了消耗战。",
    team:"社交副本囚徒",teamWhy:"你们都在「别人眼里的自己」这件事上持续失血，但解药在对方手里：<b>你替TA练习说「不」，TA替你确认「别人真的没那么在意你」</b>。互换补课，效果拔群。"},
  E:{name:"技能点错者",tag:"核心卡关维度：技能重构力",
    desc:"技能点全加在父母、社会的期望上。自己的天赋？从来没点亮过。",
    line:"「这工作是我爸妈让我做的。」",
    hope:"你能把不喜欢的技能点练到「还行」——这个学习能力本身就惊人。把它用在热爱的事上，是降维打击。天赋不是没有，它一直在等你的第一次充值（时间）。",
    deep:"你的天赋不是没有，是<b>从未获得入场资源</b>。心理学上有个概念叫「自我概念延迟」——当一个人长期按外部剧本行动，会逐渐丧失对「我擅长什么、我热爱什么」的感知力。这不是能力问题，是<b>感知通道生锈了</b>。每次你说「我也不知道自己喜欢什么」，其实是在描述一块从没被允许打开过的技能面板。判断天赋有个可靠信号叫<b>心流</b>——做那件事时别人觉得吃力、你却忘记时间。你的心流样本之所以稀缺，是因为它们从来没有被认真采集过。好消息：人生游戏里，技能点可以洗，而且洗点成本远比你以为的低。",
    list:["说起现在的工作，你用得最多的词是「还行」「就那样」「习惯了」","你有过「我其实一直想试试××」的念头，但它从没变成一节体验课、一次尝试","你选择当前路径的重要原因是「家里觉得稳定、体面」","刷到别人做热爱之事的内容时，你会停留很久","问「你擅长什么」，你的第一反应是工作技能，然后就没有第二反应了"],
    actions:["今晚做一次「技能面板盘点」：写下 3 件你做起来「别人觉得难、你不觉得累」的事——那往往就是天赋的藏身处","从里面挑 1 件，本周投入 2 小时，产出一个最小的东西：一篇文章、一张图、一顿饭、一个小工具","问 3 个熟悉你的人：「你觉得我最擅长什么？」——他视角能看见你的隐藏属性"],
    roadmap:{week:"完成技能面板盘点 + 一次 2 小时微产出，让「天赋」从概念变成实物",month:"选一个天赋方向持续投入，完成 3 次产出，用真实反馈校准方向——市场和你的热爱会告诉你重叠区在哪",year:"让新技能产生第一次真实回报：第一笔副业收入、第一个被转发的作品、第一次被以「会××的人」介绍。那一刻你就知道，洗点成功了"},
    boss:"「沉没成本怪」——「都干了这么多年了，现在换，前面不都白费了？」它守在你每次想洗点的路口。记住：过去的技能点不会清零，它们会变成你新职业的被动加成。",
    weakness:"它怕的是算总账——把「再忍20年」和「转1年试试」摆在同一张表上算，它的谎言立刻穿帮。",
    team:"氪金路人",teamWhy:"TA用花钱缓解「该学点什么」的焦虑，你用「再等等」回避试错。<b>互相盯防</b>：你帮TA把剁手清单变回钱，TA帮你把收藏夹变成行动。"},
  BC:{name:"社交副本囚徒",tag:"核心卡关维度：安全区突破 × 身份解绑",
    desc:"被亲戚、朋友、同事的评价锁死在原地。不敢不一样，因为怕被议论。",
    line:"「别人会怎么看我？」",
    hope:"你对人际信号的感知精度是间谍级别的——这个属性放在任何团队里都是核心位。唯一的配置错误，是让这台雷达一直对着自己扫描。",
    deep:"你活在无数双眼睛组成的全景监狱里——心理学叫<b>「聚光灯效应」</b>：我们总以为自己被注视的程度，是实际的 3 倍以上。你人生的一大堆决策，实际决策者不是你，是「别人会怎么说」这个<b>幻影董事会</b>——它从不签字，却有一票否决权。最讽刺的是：那些你牺牲自己去讨好的人，大多根本没在看你；而真正在意你的人，只希望你活得舒展。你不是被关起来的——<b>你是被自己想象出来的看守困住的</b>。而牢房的钥匙，从头到尾都在你手里。",
    list:["做决定前，你会先在脑内召开「亲戚朋友评审会」","你的朋友圈经过多层审核，有时编辑半天，最后干脆不发了","辞职、单身、转行、不婚——想法很久了，但「没法跟家里交代」","你羡慕那些活得肆意的人，但只敢匿名点赞","「丢人」「被人笑话」是你决策时稳定的隐藏扣分项"],
    actions:["本周做一次「小规模越狱」：公开发一次没人规定你不能发的内容——一个观点、一个作品、一段生活。然后观察：你会发现根本没人审判你","写一份「幻影董事会名单」：你怕的那些「别人」，具体是谁？写出来你会震惊于这份名单有多短、多模糊","下次决策时强制自己先写「我自己想要的是——」，写完之后，才允许「别人」发言"],
    roadmap:{week:"完成一次越狱发帖 + 幻影董事会名单，让恐惧从一团雾变成具体可数的对象",month:"推进一件「评审会不会同意但你想要」的事到可见进度，练习有分寸地承受议论",year:"完成一次正式的「身份公开」：把你的某个重大选择坦荡告知该知道的人。用你的人生说服他们，而不是用你的解释"},
    boss:"「家族群聊」——一条热搜、一句亲戚的「为你好」、一声「别人家孩子」，都能把你打回囚室。对治方法不是屏蔽，是练级：他们的评价是NPC的固定台词，而你已经拿到玩家视角。",
    weakness:"它怕的是你点名——把「别人」具体到人之后，你会发现牢房里其实只关着你一个人。",
    team:"空血条幸存者",teamWhy:"你们共享「他人评价过敏」这个 debuff，但解药恰好互备：<b>你练表达，TA练边界</b>——同一门课的两个学分，一起修。"},
  BE:{name:"氪金路人",tag:"核心卡关维度：身份解绑 × 技能重构",
    desc:"买课、买装备、囤工具，跟风氪金。以为花钱=升级，账单先爆了。",

const COMBO_MAP  = {AD:"AD",BE:"BE",BC:"BC"};
const MIX_THRESHOLD = 5; /* 两个最低维度分差≤5 判定混合型 */

function levelOf(avg){

/* ================================================================
   像素图系统：字符画 → SVG（零依赖，离线可用）
================================================================ */
function px(rows, pal, scale){
  const w = rows[0].length, h = rows.length;
  let s = '<svg viewBox="0 0 '+w+' '+h+'" width="'+(w*scale)+'" height="'+(h*scale)+'" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">';
  rows.forEach(function(row,y){
    for(let x=0;x<row.length;x++){
      const ch=row[x];
      if(ch!=="."&&pal[ch]) s+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+pal[ch]+'"/>';
    }
  });
  return s+'</svg>';
}
/* 合成：角色(12列) + 右侧道具，画到同一张画布 */
function pxCompose(mainRows, propRows, propX, propY){
  const W = Math.max(mainRows[0].length, propX+propRows[0].length);
  const H = Math.max(mainRows.length, propY+propRows.length);
  const out=[];
  for(let y=0;y<H;y++){
    let line=(mainRows[y]||"");
    while(line.length<W) line+=".";
    if(y>=propY&&y<propY+propRows.length){
      const p=propRows[y-propY];
      for(let x=0;x<p.length;x++) if(p[x]!==".") line=line.substring(0,propX+x)+p[x]+line.substring(propX+x+1);
    }
    out.push(line);
  }
  return out;
}

/* ================================================================
   计分：每维度 = 实得分 / 该维度理论满分 × 100
================================================================ */
function computeScores(){
  const earned = {A:0,B:0,C:0,D:0,E:0};
  const maxP = {A:0,B:0,C:0,D:0,E:0};
  QUESTIONS.forEach(function(q,qi){
    const ai = answers[qi];
    DIM_KEYS.forEach(function(d){
      let best = 0;
      q.o.forEach(function(o){ if(o.s[d]!==undefined && o.s[d]>best) best = o.s[d]; });
      maxP[d]+=best;
      const sel = q.o[ai];
      if(sel && sel.s[d]!==undefined) earned[d]+=sel.s[d];
    });
  });
  const scores = {};
  DIM_KEYS.forEach(function(d){
    let v = maxP[d]>0 ? (earned[d]/maxP[d])*100 : 50;
    scores[d] = Math.max(0, Math.min(100, Math.round(v)));
  });
  return scores;
}
function decideArchetype(scores){
  const sorted = DIM_KEYS.slice().sort(function(a,b){return scores[a]-scores[b];});
  const d1 = sorted[0], d2 = sorted[1];
  const diff = scores[d2]-scores[d1];
  let key, mixed=false;
  if(diff<=MIX_THRESHOLD){
    const pair = [d1,d2].sort().join("");
    if(COMBO_MAP[pair]){ key = COMBO_MAP[pair]; mixed=true; }
    else key = SINGLE_MAP[d1];
  } else key = SINGLE_MAP[d1];
  return {key:key, d1:d1, d2:d2, diff:diff, mixed:mixed};
}

let lock=false;
function select(i,btn){
  if(lock) return;
  lock=true;
  answers[cur]=i;
  btn.classList.add("selected");
  document.querySelectorAll(".opt").forEach(function(b){b.style.pointerEvents="none";});
  setTimeout(function(){
    lock=false;
    if(cur < QUESTIONS.length-1){ cur++; renderQuestion(); }
    else { startAnalysis(); }
  }, 240);
}

$("btn-back").onclick = function(){
  if(cur===0) return;
  cur--; answers[cur]=-1; renderQuestion();
};

/* ================================================================
   雷达图（原生SVG，无依赖）
================================================================ */
function radarSVG(values){
  const cx=180, cy=165, R=115;
  const ang = function(i){ return (-90 + i*72) * Math.PI/180; };
  const pt = function(i,r){ return [cx + r*Math.cos(ang(i)), cy + r*Math.sin(ang(i))]; };
  let s = '<svg viewBox="0 0 360 330" xmlns="http://www.w3.org/2000/svg">';
  [20,40,60,80,100].forEach(function(lv){
    const pts = DIM_KEYS.map(function(d,i){ return pt(i, R*lv/100).map(function(n){return n.toFixed(1);}).join(","); }).join(" ");
    s += '<polygon points="'+pts+'" fill="'+(lv===100?'rgba(34,211,238,.03)':'none')+'" stroke="#1c2a3d" stroke-width="1"/>';
  });
  DIM_KEYS.forEach(function(d,i){
    const p=pt(i,R);
    s += '<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="#1c2a3d" stroke-width="1"/>';
  });
  s += '<polygon id="radar-poly" points="'+DIM_KEYS.map(function(){return cx+","+cy;}).join(" ")+'" fill="rgba(251,191,36,.22)" stroke="#fbbf24" stroke-width="2" stroke-linejoin="round" style="filter:drop-shadow(0 0 8px rgba(251,191,36,.5))"/>';
  DIM_KEYS.forEach(function(d,i){
    s += '<circle id="radar-dot-'+i+'" cx="'+cx+'" cy="'+cy+'" r="3.5" fill="#fbbf24" stroke="#06090f" stroke-width="1"/>';
  });
  const anchors=["middle","start","start","end","end"];
  DIM_KEYS.forEach(function(d,i){
    const p=pt(i,R+26);
    s += '<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+4).toFixed(1)+'" text-anchor="'+anchors[i]+'" fill="#9fb2c8" font-size="12" font-weight="700">'+DIMS[d].name+'</text>';
    s += '<text id="radar-val-'+i+'" x="'+p[0].toFixed(1)+'" y="'+(p[1]+20).toFixed(1)+'" text-anchor="'+anchors[i]+'" fill="#fbbf24" font-size="11" font-family="monospace">'+values[d]+'</text>';
  });
  s += '</svg>';
  return s;
}
function animateRadar(values){
  const poly = document.getElementById("radar-poly");
  if(!poly) return;
  const cx=180, cy=165, R=115;
  const ang = function(i){ return (-90 + i*72) * Math.PI/180; };
  const target = DIM_KEYS.map(function(d){ return values[d]; });
  const t0 = performance.now(), dur=900;
  function frame(t){
    const p = Math.min(1,(t-t0)/dur);
    const e = 1-Math.pow(1-p,3);
    const pts = target.map(function(v,i){
      const r = R*v/100*e;
      return (cx + r*Math.cos(ang(i))).toFixed(1)+","+(cy + r*Math.sin(ang(i))).toFixed(1);
    });
    poly.setAttribute("points", pts.join(" "));
    DIM_KEYS.forEach(function(d,i){
      const dot=document.getElementById("radar-dot-"+i);
      if(dot){ dot.setAttribute("cx",pts[i].split(",")[0]); dot.setAttribute("cy",pts[i].split(",")[1]); }
    });
    if(p<1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
function barColor(v){
  if(v<40) return "#f87171";
  if(v<60) return "#fb923c";
  if(v<75) return "#22d3ee";
  return "#4ade80";
}

function buildShareText(){
  const r = lastResult;

           : (location.href && location.href.indexOf("file:")!==0 ? location.href : "");
  let txt = "【地球Online·NPC身份诊断】\n"
    + "我的身份："+r.data.name+"\n"
    + "觉醒度："+r.lv.text+"（"+r.avg+"%）\n"
    + "最卡我的关卡："+DIMS[r.weakest].name+"\n"
    + "隐藏优势："+r.data.hope+"\n"
    + "——你被什么困在NPC身份里？\n"
    + "36道题，测测你被困在哪一关";
  if(url) txt += "\n" + url;
  return txt;
}
function copyResult(){
  const txt = buildShareText();
  const done = function(){ toast("已复制，去粘贴发帖吧"); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(function(){ fallbackCopy(txt,done); });
  } else fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){
  const ta=document.createElement("textarea");
  ta.value=txt; ta.style.cssText="position:fixed;opacity:0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); done(); }
  catch(e){ toast("复制失败，请长按结果页手动复制"); }
  document.body.removeChild(ta);
}
let toastTimer=null;
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.classList.remove("show"); },2400);
}
function restart(){
  cur=0; answers.fill(-1); lastResult=null;
  $("hpfill").style.width="0%";
  renderQuestion();
  show("screen-quiz");
}
